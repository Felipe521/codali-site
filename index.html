<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0d" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Os textos do hero só começam a animar quando a fonte da marca chega (evita a troca
      // visível de fonte). O cenário anima desde a primeira pintura. Limite de 2,5 s.
      ;(function () {
        var d = document.documentElement
        if (!document.fonts || !document.fonts.load) return
        d.classList.add('aguardando-fontes')
        var pronto = function () { d.classList.remove('aguardando-fontes') }
        Promise.all([document.fonts.load('760 1em "Archivo Codali"'), document.fonts.load('500 1em "Plex Mono Codali"')]).then(pronto, pronto)
        setTimeout(pronto, 2500)
      })()
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript>
      <style>
        [data-revelar], .revelar-palavras [data-palavra] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
